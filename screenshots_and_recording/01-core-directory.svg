<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#0f172a"/>
  <rect x="48" y="44" width="1104" height="672" rx="14" fill="#111827" stroke="#334155"/>
  <text x="80" y="92" fill="#e5e7eb" font-family="Consolas, monospace" font-size="28" font-weight="700">agent_package 独立最小验证项目</text>
  <text x="80" y="134" fill="#94a3b8" font-family="Consolas, monospace" font-size="18">clone 后进入仓库根目录，直接运行 python scripts/run_full_verification.py</text>
  <text x="80" y="188" fill="#a7f3d0" font-family="Consolas, monospace" font-size="20">ai_enhancement/</text>
  <text x="122" y="222" fill="#e5e7eb" font-family="Consolas, monospace" font-size="18">aiops_summary_enhancer.py   结构化摘要、风险解释、下一步动作</text>
  <text x="80" y="276" fill="#a7f3d0" font-family="Consolas, monospace" font-size="20">sample_events/</text>
  <text x="122" y="310" fill="#e5e7eb" font-family="Consolas, monospace" font-size="18">cpu_alert_events.json       CPU 告警、指标和日志证据</text>
  <text x="122" y="344" fill="#e5e7eb" font-family="Consolas, monospace" font-size="18">tool_failure_events.json    工具失败和证据链中断</text>
  <text x="80" y="398" fill="#a7f3d0" font-family="Consolas, monospace" font-size="20">scripts/</text>
  <text x="122" y="432" fill="#e5e7eb" font-family="Consolas, monospace" font-size="18">run_offline_demo.py         单样例运行入口</text>
  <text x="122" y="466" fill="#e5e7eb" font-family="Consolas, monospace" font-size="18">run_full_verification.py    一键验证并生成完整日志</text>
  <text x="80" y="520" fill="#a7f3d0" font-family="Consolas, monospace" font-size="20">tests/</text>
  <text x="122" y="554" fill="#e5e7eb" font-family="Consolas, monospace" font-size="18">test_aiops_summary_enhancer.py  两条可复现测试样例</text>
  <text x="80" y="608" fill="#a7f3d0" font-family="Consolas, monospace" font-size="20">verification_logs/</text>
  <text x="122" y="642" fill="#e5e7eb" font-family="Consolas, monospace" font-size="18">latest_verification.txt     命令、退出码、stdout/stderr、总结果</text>
  <text x="122" y="676" fill="#e5e7eb" font-family="Consolas, monospace" font-size="18">latest_verification_summary.json  机器可读验证摘要</text>
</svg>
