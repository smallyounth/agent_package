<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="80" y="78" fill="#0f172a" font-family="Arial, sans-serif" font-size="30" font-weight="700">AIOps Agent 状态流：Plan - Execute - Replan</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="86" y="164" width="210" height="96" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="136" y="206" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="24" font-weight="700">Planner</text>
  <text x="112" y="238" fill="#1e40af" font-family="Arial, sans-serif" font-size="16">查知识库 + 制定计划</text>
  <line x1="296" y1="212" x2="420" y2="212" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="430" y="164" width="210" height="96" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="476" y="206" fill="#14532d" font-family="Arial, sans-serif" font-size="24" font-weight="700">Executor</text>
  <text x="460" y="238" fill="#166534" font-family="Arial, sans-serif" font-size="16">调用观测 / 本地工具</text>
  <line x1="640" y1="212" x2="764" y2="212" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="774" y="164" width="230" height="96" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="824" y="206" fill="#92400e" font-family="Arial, sans-serif" font-size="24" font-weight="700">Replanner</text>
  <text x="802" y="238" fill="#92400e" font-family="Arial, sans-serif" font-size="16">继续 / 重规划 / 输出</text>
  <path d="M 886 260 C 858 348, 566 358, 536 260" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1004" y1="212" x2="1114" y2="212" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="896" y="378" width="220" height="96" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="948" y="420" fill="#991b1b" font-family="Arial, sans-serif" font-size="24" font-weight="700">Report</text>
  <text x="924" y="452" fill="#991b1b" font-family="Arial, sans-serif" font-size="16">根因 + 风险 + 建议</text>
  <line x1="936" y1="260" x2="1000" y2="372" stroke="#ef4444" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="94" y="378" width="640" height="144" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="124" y="420" fill="#0f172a" font-family="Arial, sans-serif" font-size="22" font-weight="700">状态字段</text>
  <text x="124" y="458" fill="#334155" font-family="Consolas, monospace" font-size="18">input: 原始任务</text>
  <text x="124" y="488" fill="#334155" font-family="Consolas, monospace" font-size="18">plan: 剩余计划步骤</text>
  <text x="390" y="458" fill="#334155" font-family="Consolas, monospace" font-size="18">past_steps: 已执行步骤和结果</text>
  <text x="390" y="488" fill="#334155" font-family="Consolas, monospace" font-size="18">response: 最终报告</text>
</svg>
